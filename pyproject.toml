[project]
name = "dss5105-track2-dispatch-desk"
version = "0.1.0"
description = "Track 2: The Quick-Response Subcontracting Desk — a dispatcher agent over deterministic tools"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40",
    "openai>=1.0",
    "streamlit>=1.30",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=7.0",
]
[tool.poetry]
package-mode=false
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
