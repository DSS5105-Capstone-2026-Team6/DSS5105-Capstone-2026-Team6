[project]
name = "data-science-collaboration"
version = "0.1.0"
description = "Data Science Collaboration Project"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas>=1.5.0",
    "numpy>=1.21.0",
    "matplotlib>=3.5.0",
    "seaborn>=0.11.0",
    "scikit-learn>=1.1.0",
    "scipy>=1.9.0",
    "jupyter>=1.0.0",
    "ipython>=8.0.0",
    "notebook>=6.4.0",
    "plotly>=5.0.0",
    "bokeh>=2.4.0",
    "xgboost>=1.6.0",
    "lightgbm>=3.3.0",
    "requests>=2.28.0",
    "openpyxl>=3.0.0",
    "pytest>=7.0.0",
    "black>=22.0.0",
    "flake8>=5.0.0",
    "pre-commit>=2.20.0",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "jupyterlab>=4.6.3",
]
