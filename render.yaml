# Render blueprint: one free web service running the Telegram bot via long
# polling. Secrets are set in the Render dashboard (sync: false never stores
# values in the repo).
#
# Free tier caveats:
# - the instance sleeps after ~15 min without HTTP traffic -> point a free
#   UptimeRobot monitor (5-min interval) at https://<service>.onrender.com/
# - the bot uses polling, so sleeping only delays replies, never loses them
#   (Telegram queues undelivered updates)
# Render blueprint: ONE free web service running both the Telegram bot
# (long polling, background thread) and the FastAPI web frontend (uvicorn
# on $PORT) via adapter/run_all.py. The existing UptimeRobot monitor that
# keeps the bot awake keeps the web UI awake too — no second service, no
# extra cost, one Supabase ledger, one secret set.
#
# Free tier caveats:
# - the instance sleeps after ~15 min without HTTP traffic -> keep the free
#   UptimeRobot monitor (5-min interval) on https://<service>.onrender.com/
# - the bot uses polling, so sleeping only delays replies, never loses them
#   (Telegram queues undelivered updates)
services:
  - type: web
    name: dispatch-desk-bot
    runtime: python
    plan: free
    branch: main
    buildCommand: pip install -r adapter/requirements.txt -r api/requirements.txt
    startCommand: python -m adapter.run_all
    healthCheckPath: /
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      # Shared Supabase ledger (bot and web shared mode use the same tables).
      - key: DISPATCH_DATABASE_URL
        sync: false
      - key: DISPATCH_DATABASE_PASSWORD
        sync: false
      # Optional: set to gate the web UI behind a password; blank = open.
      - key: APP_PASSWORD
        sync: false
