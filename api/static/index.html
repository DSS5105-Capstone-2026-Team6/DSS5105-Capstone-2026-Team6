<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dispatch Desk</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>

<div id="loginOverlay" style="display:none">
  <div class="card">
    <h3>Dispatch Desk</h3>
    <p class="muted">Enter the app password</p>
    <div class="row" style="justify-content:center">
      <input id="pw" type="password" placeholder="APP_PASSWORD">
      <button id="loginBtn" class="primary">Sign in</button>
    </div>
    <div id="pwErr" class="warn"></div>
  </div>
</div>

<div class="layout">
  <main>
    <h1><span class="dot"></span> Dispatch Desk</h1>
    <div class="tabs">
      <button id="tabbtn-desk" class="active">Desk</button>
      <button id="tabbtn-dashboard">Dashboard</button>
      <button id="tabbtn-records">Records</button>
    </div>

    <!-- ============ DESK TAB ============ -->
    <section id="tab-desk">
      <h2>Scenario preview · Production and transport</h2>
      <div class="row">
        <input id="scOrder" value="ORD-063" style="width:110px" title="Order ID">
        <input id="scDate" type="date" title="preview start date">
        <label class="muted"><input id="scClosed" type="checkbox"> Sundays closed</label>
        <input id="scDelay" type="number" min="0" max="14" value="0" style="width:70px" title="extra transport days">
        <input id="scNoise" type="number" min="0" max="50" step="5" value="0" style="width:70px" title="capacity noise %">
        <input id="scSeed" type="number" value="5105" style="width:80px" title="seed">
        <button id="scRun" class="small">Run</button>
      </div>
      <div id="scResult"></div>

      <h2>Inbox</h2>
      <div class="row">
        <select id="sampleSel"></select>
        <button id="sampleBtn" class="small">Load sample</button>
        <label class="small" style="border:1px solid var(--line);border-radius:10px;padding:5px 10px;cursor:pointer">
          Upload .txt<input id="fileInput" type="file" accept=".txt" style="display:none"></label>
        <button class="small" onclick="document.getElementById('inbox').value=''">Clear</button>
      </div>
      <textarea id="inbox" placeholder="Ravi: ORD-063 — 100 cardigans, make Apr 29."></textarea>
      <div class="row">
        <button id="dispatchBtn" class="primary">Dispatch</button>
        <button id="confirmAllBtn" class="small">✅ Confirm all open</button>
        <span id="status"></span>
      </div>

      <h2>LLM parser</h2>
      <textarea id="parserBox" placeholder="Boss: ORD-045 — 150 vests for Cotton Club, due Apr 09. It's urgent." style="min-height:70px"></textarea>
      <div class="row"><button id="parseBtn" class="small">Parse</button></div>
      <div id="parseResult"></div>

      <div id="kpis" class="kpis"></div>
      <div id="caseFilter" class="row"></div>
      <div id="worklist"></div>
    </section>

    <!-- ============ DASHBOARD TAB ============ -->
    <section id="tab-dashboard" style="display:none">
      <div id="dashTimeline"></div>
      <div id="dashLens"></div>
      <div id="dashCapacity"></div>
      <div id="dashMap"></div>
    </section>

    <!-- ============ RECORDS TAB ============ -->
    <section id="tab-records" style="display:none">
      <div class="row">
        <span class="muted">Storage: <b id="recordsShared"></b></span>
        <button id="shareBtn" class="small"></button>
        <button id="resetBtn" class="small">Reset demo</button>
      </div>
      <div id="recordsList"></div>
    </section>
  </main>

  <!-- ============ RIGHT RAIL ============ -->
  <aside>
    <div class="dock" id="queueDock"></div>
    <div class="dock" id="objDock"></div>
    <div class="dock" id="worldDock"></div>
  </aside>
</div>

<script src="/static/app.js"></script>
</body>
</html>
